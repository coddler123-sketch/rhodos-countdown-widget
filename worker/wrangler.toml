name = "rhodos-news"
main = "src/index.js"
compatibility_date = "2026-07-05"

[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
MAX_ARTICLES = "20"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "NEWS_CACHE"

[[d1_databases]]
binding = "NEWS_DB"
database_name = "rhodos-news-db"
database_id = "49c42ec0-a828-4497-92c2-4ce73c7bdd0c"

[triggers]
crons = ["17 */4 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
