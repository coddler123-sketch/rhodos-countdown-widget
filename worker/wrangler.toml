name = "rhodos-news"
main = "src/index.js"
compatibility_date = "2026-07-05"

[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
MAX_ARTICLES = "20"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "NEWS_CACHE"

[triggers]
crons = ["17 */4 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
